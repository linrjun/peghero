<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#10131f">
  <meta name="description" content="弹珠勇者：手机竖屏弹珠 Roguelike">
  <title>弹珠勇者 v1.0 重构版</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="app">
<canvas id="game"></canvas>
<div id="hud">
  <div class="top">
    <div class="pill">
      <div class="label">勇者生命</div><div class="big"><span id="php">100</span>/<span id="pmax">100</span></div>
      <div class="bar"><div id="pfill" class="fill playerFill"></div></div>
    </div>
    <div class="pill center">
      <div class="label" id="enemyName">史莱姆</div><div class="big"><span id="ehp">60</span>/<span id="emax">60</span></div>
      <div class="bar"><div id="efill" class="fill enemyFill"></div></div>
    </div>
    <div class="pill center">
      <div class="label">敌人意图</div><div class="big intent">⚔ <span id="intent">8</span></div>
    </div>
  </div>
  <div class="orbPanel">
    <div id="orbIcon" class="orbIcon">🟡</div>
    <div class="orbText"><b id="orbName">普通弹珠</b><span id="orbDesc">稳定造成伤害</span></div>
  </div>
  <div class="magazine">
    <span class="magLabel">弹夹</span>
    <span id="magRounds" class="magRounds"></span>
    <span id="magCount" class="magCount">0/0</span>
  </div>
  <div class="sideBtns">
    <button id="deckBtn">弹珠袋 4</button>
    <button id="relicBtn">遗物 0</button>
    <button id="motionBtn">摇晃辅助：关</button>
    <button id="pegBtn">钉子袋 0/2</button>
    <button id="buildBtn">流派详情</button>
  </div>
  <div class="resource">🪙 <span id="coins">0</span>　🗺️ 第 <span id="stage">1</span> 层</div>
  <div id="pegHint" class="pegHint">点击一个钉子进行替换</div>
  <div id="buildStrip" class="buildStrip">当前构筑：未成形</div>
  <div class="bottom">
    <div class="tip" id="tip">按住顶部弹珠并向反方向拖动，松手发射。</div>
    <button id="restart">重开</button>
  </div>
</div>
<div id="overlay"><div class="card">
  <h2 id="overlayTitle">奖励</h2><p id="overlayText"></p><div id="overlayBody"></div>
</div></div>
</div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
